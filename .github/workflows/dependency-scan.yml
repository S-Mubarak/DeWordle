name: Dependency Vulnerability Scan
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit frontend
        run: cd frontend && npm audit --audit-level=high
      - name: Audit backend
        run: cd backend && npm audit --audit-level=high