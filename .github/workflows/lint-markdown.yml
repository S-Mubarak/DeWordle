name: Lint Markdown Documentation
on:
  push:
    paths: ["**/*.md"]
  pull_request:
    paths: ["**/*.md"]
jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"